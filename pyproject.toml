[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["PyCamCalib*"]
# The Flask apps ship their own Pyodide copy of core/ under static/; keep them out of the wheel.
exclude = ["PyCamCalib.camera_calibration_flask*", "PyCamCalib.test*"]

[tool.setuptools.package-data]
"*" = ["*.jpg"]

[project.gui-scripts]
camera_calibration_gui = "PyCamCalib.camera_calibration_gui.__main__:launch_gui"

[project.scripts]
camera_calibration_gui = "PyCamCalib.camera_calibration_gui.__main__:launch_gui"

[project]
name = "PyCamCalib"
version = "2.0.2"
authors = [
  { name="Michaël Hillen", email="michael.hillen@uantwerpen.be" },
]
description = "PyCamCalib: Python library for camera and stereo calibration."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
  'h5py',
  'importlib_resources',
  'matplotlib',
  'numpy',
  "opencv-contrib-python>=4.11.0.86",
  'PyCBD',
  'CTPv',
]

[project.optional-dependencies]
gui = [
  'pyqtgraph',
  'PySide6',
]
web = [
  'flask',
  'gunicorn',
]

[dependency-groups]
dev = [
  'build',
  'Sphinx',
  'sphinx-rtd-theme',
  'sphinx-autodoc-typehints',
]

[project.urls]
"Homepage" = "https://github.com/InViLabUAntwerp/PyCamCalib"
"Repository" = "https://github.com/InViLabUAntwerp/PyCamCalib"
"Issues" = "https://github.com/InViLabUAntwerp/PyCamCalib/issues"
