<!-- INFO MODAL -->
<div class="modal fade" id="infoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content border-0">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold" id="infoModalTitle">Information</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body info-content" id="infoModalContent" style="max-height: 70vh; overflow-y: auto;"></div>
        </div>
    </div>
</div>

<!-- CODE SNIPPET MODAL -->
<div class="modal fade" id="codeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content border-0">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title fw-bold" id="codeModalTitle">Generated Code</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body position-relative">
                <button class="btn btn-sm btn-success position-absolute top-0 end-0 m-3 fw-bold" onclick="copyCodeSnippet()">Copy Code</button>
                <pre class="bg-light p-3 rounded mt-4 border border-secondary" style="max-height: 500px; overflow-y: auto;"><code id="codeSnippetContent"></code></pre>
            </div>
        </div>
    </div>
</div>
