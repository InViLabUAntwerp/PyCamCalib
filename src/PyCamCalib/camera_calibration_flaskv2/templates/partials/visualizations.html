<!-- RMS Plot -->
<div class="card shadow-sm mb-4 border-0">
    <div class="card-header bg-dark text-white p-2 d-flex justify-content-between align-items-center">
        <span class="ps-2 fw-bold">RMS Reprojection Error</span>
        <button class="btn btn-info-icon" onclick="showInfoModal('info_rms_plot.html')"><i class="bi bi-info-lg"></i></button>
    </div>
    <div class="card-body border">
        <p class="text-muted small mb-1">Click on a bar to mark it for removal (turns <span style="color: #ea2c38; font-weight: bold;">Red</span>), then click "Recalculate".</p>
        <div id="reprojPlot" style="width:100%; height:300px;"></div>
    </div>
</div>

<!-- Distortion Map -->
<div class="card shadow-sm mb-4 border-0">
    <div class="card-header bg-dark text-white p-2 d-flex justify-content-between align-items-center">
        <span class="ps-2 fw-bold">Distortion Map</span>
        <div>
            <button class="btn btn-info-icon me-2" onclick="showInfoModal('info_distortion.html')"><i class="bi bi-info-lg"></i></button>
            <button class="btn btn-sm btn-light fw-bold text-dark" id="btnExportDistortion" onclick="exportDistortion()" disabled>Export Image</button>
        </div>
    </div>
    <div class="card-body border">
        <div class="d-flex justify-content-end mb-2">
            <div class="btn-group" role="group">
                <button class="btn btn-sm btn-outline-secondary" onclick="distZoom.zoom(0.2)">Zoom In (+)</button>
                <button class="btn btn-sm btn-outline-secondary" onclick="distZoom.zoom(-0.2)">Zoom Out (-)</button>
                <button class="btn btn-sm btn-outline-danger" onclick="distZoom.reset()">Reset</button>
            </div>
        </div>
        <div class="text-center rounded mb-3 overflow-hidden image-viewer-container" id="distContainer" style="position: relative; height: 500px; display: flex; align-items: center; justify-content: center; cursor: grab;">
            <img id="distImg" src="" class="d-none" alt="Distortion Plot" style="max-width: 100%; max-height: 100%; object-fit: contain; transition: transform 0.1s ease-out; transform-origin: center center;">
        </div>
    </div>
</div>

<!-- Detections Viewer -->
<div class="card shadow-sm mb-4 border-0">
    <div class="card-header bg-dark text-white p-2 d-flex justify-content-between align-items-center">
        <span class="ps-2 fw-bold">Detections Viewer</span>
        <button class="btn btn-info-icon" onclick="showInfoModal('info_detections.html')"><i class="bi bi-info-lg"></i></button>
    </div>
    <div class="card-body border">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="fw-bold text-truncate me-2" style="color: #002e65; max-width: 35%;" id="viewerName">Index: N/A | Image: N/A</span>
            <div class="btn-group" role="group">
                <button class="btn btn-sm btn-outline-secondary" onclick="detZoom.zoom(0.2)">Zoom In (+)</button>
                <button class="btn btn-sm btn-outline-secondary" onclick="detZoom.zoom(-0.2)">Zoom Out (-)</button>
                <button class="btn btn-sm btn-outline-danger" onclick="detZoom.reset()">Reset</button>
            </div>
            <div class="ms-2">
                <span class="badge bg-info text-dark fs-6 border border-info" id="viewerShape">Shape: N/A</span>
                <span class="badge bg-primary fs-6" id="viewerError">Error: N/A</span>
            </div>
        </div>
        <div class="text-center rounded mb-3 overflow-hidden image-viewer-container" id="imageContainer" style="position: relative; height: 500px; display: flex; align-items: center; justify-content: center; cursor: grab;">
            <img id="detectionImg" src="" class="d-none" alt="Detection View" style="max-width: 100%; max-height: 100%; object-fit: contain; transition: transform 0.1s ease-out; transform-origin: center center;">
        </div>
        <div class="d-flex align-items-center gap-2">
            <span id="lblMinIdx" class="fw-bold text-muted">0</span>
            <input type="range" class="form-range flex-grow-1" id="imageSlider" min="0" max="0" value="0" disabled onchange="appFetchDetectionImage(this.value)">
            <span id="lblMaxIdx" class="fw-bold text-muted">0</span>
        </div>
    </div>
</div>

<!-- Extrinsics -->
<div class="card shadow-sm mb-4 border-0">
    <div class="card-header bg-dark text-white p-2 d-flex justify-content-between align-items-center">
        <span class="ps-2 fw-bold">3D Board Positions (Extrinsics)</span>
        <button class="btn btn-info-icon" onclick="showInfoModal('info_extrinsics.html')"><i class="bi bi-info-lg"></i></button>
    </div>
    <div class="card-body border">
        <p class="text-muted small mb-1">Interactive 3D view of the camera (origin) and calibration boards.</p>
        <div id="extrinsicsPlot" style="width:100%; height:400px;"></div>
    </div>
</div>
