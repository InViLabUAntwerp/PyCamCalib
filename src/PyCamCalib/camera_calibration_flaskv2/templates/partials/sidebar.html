<!-- Settings Card -->
<div class="card shadow-sm mb-4 border-0">
    <div class="card-header bg-primary text-white fw-bold d-flex justify-content-between align-items-center">
        <span>Settings</span>
        <button class="btn btn-info-icon" onclick="showInfoModal('info_settings.html')"><i class="bi bi-info-lg"></i></button>
    </div>
    <div class="card-body bg-light border">
        <div class="mb-3">
            <label for="detectorType" class="form-label text-dark fw-bold">Detector Type</label>
            <select class="form-select border-secondary" id="detectorType" onchange="toggleDetectorOptions()">
                <option value="checkerboard" selected>Checkerboard</option>
                <option value="charuco">ChArUco</option>
            </select>
        </div>
        <div id="charucoOptions" class="mb-3 d-none">
            <label for="charucoPreset" class="form-label text-dark fw-bold">ChArUco Preset</label>
            <select class="form-select border-secondary" id="charucoPreset">
                <option value="None" selected>Auto-Detect Board</option>
                <option value="wenglor">Wenglor Board</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label text-dark fw-bold" id="checkerSizeLabel">Square Size (mm)</label>
            <input type="number" class="form-control border-secondary" id="checkerSize" value="1.0" step="0.1">
        </div>
        <div class="mb-3" id="boardSizeGroup">
            <label class="form-label text-dark fw-bold">Board Corners (Cols &times; Rows) <span class="fw-normal text-muted">- Optional</span></label>
            <div class="input-group">
                <input type="number" class="form-control border-secondary" id="boardWidth" placeholder="Auto" min="3">
                <span class="input-group-text border-secondary">&times;</span>
                <input type="number" class="form-control border-secondary" id="boardHeight" placeholder="Auto" min="3">
            </div>
        </div>
        <div class="form-check mb-3" id="absoluteCheckGroup">
            <input class="form-check-input" type="checkbox" id="absoluteCheck">
            <label class="form-check-label text-dark" for="absoluteCheck">Require all corners (Absolute)</label>
        </div>
        <div class="mb-3">
            <label class="form-label text-dark fw-bold">Pixel Size (&mu;m) - Optional</label>
            <input type="number" class="form-control border-secondary" id="pixelSize" step="0.01" placeholder="e.g. 3.45">
        </div>
        <div class="mb-3">
            <label class="form-label text-dark fw-bold">Info / Name (Optional)</label>
            <input type="text" class="form-control border-secondary" id="infoInput" placeholder="e.g. Camera 1">
        </div>
        <div class="mb-3">
            <label class="form-label text-dark fw-bold">Select Local Images</label>
            <input type="file" class="form-control border-secondary" id="imageFiles" multiple accept=".jpg,.jpeg,.png,.bmp,.tiff">
            {% if compute_mode == 'server' %}
            <div class="form-text text-muted small">Max total upload: {{ max_upload_mb }}MB</div>
            {% endif %}
        </div>
        <button class="btn btn-outline-primary w-100 mb-2 fw-bold" onclick="appLoadExampleData()">Load Example Data</button>
        <button class="btn btn-success w-100 fw-bold" id="btnCalibrate" onclick="appInitialCalibration()" disabled>1. Run Calibration</button>
        <button class="btn btn-danger w-100 mt-2 fw-bold" id="btnRecalculate" onclick="appRecalculate()" disabled>2. Remove Outliers & Recalculate</button>
        <button class="btn btn-outline-secondary w-100 mt-2" id="btnReset" onclick="appResetOutliers()" disabled>Reset All Images</button>
    </div>
</div>

<!-- Parameters Export Card -->
<div class="card shadow-sm mb-4 border-0">
    <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center fw-bold">
        <span>Parameters</span>
        <div>
            <button class="btn btn-info-icon me-2" onclick="showInfoModal('info_parameters.html')"><i class="bi bi-info-lg"></i></button>
            <button class="btn btn-sm btn-light text-dark fw-bold me-1" id="btnExport" onclick="exportJSON()" disabled>Export JSON</button>
            <button class="btn btn-sm btn-light text-dark fw-bold" id="btnExportLensfun" onclick="exportLensfunXML()" disabled>Export XML</button>
        </div>
    </div>
    <div class="card-body p-0 table-responsive border">
        <table class="table table-striped table-hover mb-0" id="resultsTable">
            <thead class="table-light"><tr><th>Param</th><th>Value</th><th>SD</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<!-- Dev Tools -->
<div class="card shadow-sm mb-4 border-0">
    <div class="card-header bg-dark text-white fw-bold">Developer Tools</div>
    <div class="card-body bg-light border">
        <button class="btn btn-outline-dark w-100 mb-2 fw-bold" onclick="showCameraParametersScript()">Code: Use JSON Params</button>
        <button class="btn btn-outline-dark w-100 fw-bold" onclick="showBatchCalibrationScript()">Code: Batch Script</button>
    </div>
</div>
